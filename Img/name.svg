<svg width="800" height="220" viewBox="0 0 800 220" xmlns="http://www.w3.org/2000/svg">
  <style>
    .stroke {
      fill: none;
      stroke: #00C2FF;
      stroke-width: 3;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 1200;
      stroke-dashoffset: 1200;
      animation: draw 4s ease forwards;
    }

    .delay {
      animation-delay: 3.8s;
    }

    @keyframes draw {
      to {
        stroke-dashoffset: 0;
      }
    }
  </style>

  <!-- Pratik -->
  <path class="stroke" d="
    M80 130 
    Q100 60 130 90 
    T180 100 
    Q200 120 180 140 
    Q160 160 130 140 
    Q110 120 150 110

    M200 140 
    Q220 90 260 110 
    T300 120

    M310 140 
    Q330 90 360 120 
    T400 140

    M410 140 
    Q430 90 460 120 
    T500 140

    M510 140 
    Q530 100 560 120 
    T600 140
  "></path>

  <!-- Devadhe -->
  <path class="stroke delay" d="
    M150 190 
    Q180 140 220 170 
    T280 180

    M290 190 
    Q320 140 360 170 
    T420 190

    M430 190 
    Q460 140 500 170 
    T560 190

    M570 190 
    Q600 140 640 170 
    T700 190
  "></path>
</svg>